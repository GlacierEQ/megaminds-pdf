name: PDF viewer verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Test, build, and audit the document viewer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Execute viewer behavior tests
        run: npm run test:ci

      - name: Build the production bundle
        run: npm run build

      - name: Reject high-severity production dependency findings
        run: npm run audit:prod
